name: Build APK

on:
  push:
    branches: ["claude/**", "main"]
  workflow_dispatch:

permissions:
  # Needed to publish the APK as a release asset.
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Run core unit tests
        run: ./gradlew :core:test --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: assistant-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # A workflow artifact downloads as a zip and needs a logged-in GitHub session, which is awkward
      # on a phone. A release asset is a direct link the device browser can install from.
      # Published in the release notes so a failed install can be checked against the real file
      # rather than guessed at: a truncated download is a common cause of "App not installed".
      - name: Describe the APK
        id: apk
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "sha256=$(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "bytes=$(stat -c%s "$APK")" >> "$GITHUB_OUTPUT"

      - name: Publish APK to the rolling debug release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: Debug build (latest)
          body: |
            Debug APK built from `${{ github.sha }}` on `${{ github.ref_name }}`.

            - Size: `${{ steps.apk.outputs.bytes }}` bytes
            - SHA-256: `${{ steps.apk.outputs.sha256 }}`

            Signed with the repository's committed debug key, so every build installs over the last
            one. If you get "App not installed", uninstall any existing copy first, and check the
            downloaded file against the SHA-256 above before anything else. Not for distribution.
          prerelease: true
          make_latest: false
          files: app/build/outputs/apk/debug/*.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/**
            app/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
